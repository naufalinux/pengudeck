[package]
name = "hermes-dash-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", default-features = false, optional = true }

[features]
# Read-only kanban event history. Native only; the web crate must not enable it.
events = ["dep:rusqlite"]

[[test]]
name = "events"
required-features = ["events"]
